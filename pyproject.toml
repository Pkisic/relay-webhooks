[project]
name = "relay"
version = "0.1.0"
description = "Self-hosted toolkit for capturing, inspecting and replaying webhooks"
readme = "README.md"
authors = [{ name = "Predrag Kisic", email = "pedjakisic@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]
[tool.ruff]
target-version = "py313"
line-length = 88
[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
